# Canonical fixed-base gravity curriculum.  Vectors are generated by
# scripts/run_gravity_curriculum.py as the 42 old sphere locations with the
# physical-gravity sign (not the historical tilt/up sign).
name: gravity_42
target_set: canonical_42

# Relative to this curricula/ directory.  The default Shadow curriculum starts
# from the ordinary gravity checkpoint supplied by the experiment.
seed_checkpoint:
  Shadowhand18Gravity: ../runs/Shadowhand18_25-18-08-31_0/nn/Shadowhand18.pth

# These are runtime palm-frame values for the standard assets.  The task also
# computes and prints them from the resolved palm rigid-body pose at startup;
# a changed asset/palmBodyName must update this manifest before training.
native_gravity_in_palm:
  Shadowhand18Gravity: [0.0, 1.0, 0.0]
  WujiHandGravity: [-1.0, 0.0, 0.0]

training:
  gpu_ids: [0, 1, 2, 3]
  num_envs: 65536
  minibatch_size: 65536
  max_iterations: 200000
  episode_length: 300
  score_to_win: 2000
  save_best_after: 1
  timeout_seconds: 10800
  min_free_memory_mb: 4096
  horizon_length: 8
  resource_profiles:
    - {min_free_memory_mb: 40000, num_envs: 65536, minibatch_size: 65536}
    - {min_free_memory_mb: 20000, num_envs: 65536, minibatch_size: 65536}
    - {min_free_memory_mb: 10000, num_envs: 20480, minibatch_size: 20480}
    - {min_free_memory_mb: 4096, num_envs: 10240, minibatch_size: 10240}
  object_type: block
  # The launcher measures the canonical grid's minimum neighbour distance
  # (22.062191... deg) and uses twice that value by default.
