    theta_deg: 150
    phi_deg: 0
    base_tilt_axis: [0.0, 1.0, 0.0]
    base_yaw_deg: 0.0
    recorded_reward: 14185.9805
  - id: existing_south_pole
    checkpoint: ../runs/Shadowhand18Tilted_30-21-46-52_180/nn/Shadowhand18Tilted.pth
    theta_deg: 180
    phi_deg: 0
    base_tilt_axis: [0.0, 1.0, 0.0]
    base_yaw_deg: 0.0
    recorded_reward: 25952.3496
  - id: existing_p180_t160
    checkpoint: ../runs/Shadowhand18Tilted_31-10-08-26_200/nn/Shadowhand18Tilted.pth
    theta_deg: 160
    phi_deg: 180
    base_tilt_axis: [0.0, -1.0, 0.0]
    base_yaw_deg: 0.0
    recorded_reward: 6382.3726

training:
  # Conservative fallback and profiles for the observed ~24 GiB free remote
  # GPUs.  One worker is placed on each listed GPU, so 24 GiB selects 10240
  # envs instead of the legacy 40960-env profile.
  num_envs: 10240
  minibatch_size: 10240
  max_iterations: 200000
  episode_length: 300
  score_to_win: 2500
  # Soft 30-degree continuity target. If the closest remote frontier failed,
  # immediately continue from the globally nearest successful parent.
  max_parent_transition_deg: 30.0
  # The old remote tree contains low-reward *_rew_* checkpoints. Do not let
  # discovery use them as parents; listed historical checkpoints stay valid.
  discovered_parent_min_reward: 2500
  allow_unscored_discovered_parents: false
  # Checkpoint progression is deliberately score-driven: once the saved
  # RL-Games checkpoint has last_mean_rewards > score_to_win it immediately
  # becomes a parent. Physical evaluation remains available as an explicit
  # diagnostic/re-certification tool, but can never halt this training queue.
  promotion_mode: reward_only
  save_best_after: 1
  object_type: block
  gpu: "0"
  # Only list devices that this machine/user may use. The launcher schedules at
  # most one trainer per available device and skips devices below the free-
  # memory threshold.
  gpu_ids: [0, 1, 2, 3]
  min_free_memory_mb: 4096
  # A profile is selected independently from each GPU's current free memory.
  # The rollout horizon is 8, and every minibatch divides num_envs*horizon.
  # If nvidia-smi is unavailable, the top-level 10240/10240 fallback is used.
  horizon_length: 8
  resource_profiles:
    - {min_free_memory_mb: 40000, num_envs: 20480, minibatch_size: 20480}
    - {min_free_memory_mb: 20000, num_envs: 10240, minibatch_size: 10240}
    - {min_free_memory_mb: 10000, num_envs: 5120,  minibatch_size: 5120}
    - {min_free_memory_mb: 4096,  num_envs: 2048,  minibatch_size: 2048}
  timeout_seconds: 10800
  object_gravity_compensation_seconds: 0.2
  object_gravity_ramp_seconds: 0.1
  # Before each new/retried target, evaluate its selected parent at the
  # hard-coded offset and every +/-3 cm XYZ neighbor.  The winner replaces
  # only that training attempt's scalar objectPalmOffset.
  offset_probe:
    enabled: true
    num_envs: 65536
    episodes: 65536
    step_m: 0.03
    timeout_seconds: 1800
    seed: 314159
  certification_success_rate: 0.60
  certification_episodes: 128
  certification_num_envs: 128
  certification_timeout_seconds: 1800

# Direction convention:
#   base_tilt_axis = [-sin(phi), cos(phi), 0]
#   gravity/palm direction = [sin(theta) cos(phi), sin(theta) sin(phi), cos(theta)]
# The initial order is only a geometric fallback. At launch, every target gets
# the optimal equivalent task.env.baseYawDeg from its actual selected parent;
# this removes the old arbitrary roll/yaw discontinuity in world-frame MLP
# observations without changing the gravity-in-palm direction or offset.
