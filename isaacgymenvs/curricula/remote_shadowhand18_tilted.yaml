# Remote, block-only Shadowhand18Tilted curriculum.  The 42 verified
# gravity-in-palm directions below are automatically densified to 15-degree
# coverage by the current launcher; no bridge cases are introduced.
version: 1
name: remote_shadowhand18_tilted_block

# Keep the remote run root explicit. All seed/start paths below are also
# manifest-relative, so moving the whole IsaacGymEnvs tree remains valid.
checkpoint_search_roots:
  - /remote-home/ums_wangsiyun/zhy_env/IsaacGymEnvs/isaacgymenvs/runs

density:
  # Preserve the 42 verified targets, then add real, evenly spread maximin
  # training cases until every sphere direction is within 15 degrees of one.
  coverage_radius_deg: 15.0

# This manifest intentionally trains block only.  Do not enable this stage
# until the block policy has been reviewed.
multi_object_stage:
  enabled: false
  object_types: [block]

seed:
  # Editable fallback starting checkpoint. The launcher also considers every
  # successful existing_start_checkpoint below and chooses the closest one.
  start_checkpoint: ../runs/Shadowhand18Tilted_28-20-15-05_15/nn/Shadowhand18Tilted.pth
  theta_deg: 15
  phi_deg: 0
  base_tilt_axis: [0.0, 1.0, 0.0]
  # Historical remote checkpoint orientation. The launcher computes a new
  # child world-Z yaw for every real parent -> child transition, preserving
  # gravity-in-palm while avoiding world-frame MLP observation jumps.
  base_yaw_deg: 0.0

# Existing policies with last_mean_rewards > 2500. Angles above 180 degrees in
# their original configs are written here in the equivalent canonical form:
# Rot(+Y, angle) == Rot(-Y, 360-angle), hence phi=180.
# These are immediately available as parents; newly completed curriculum
# checkpoints are added to the same closest-parent pool at runtime.
existing_start_checkpoints:
  - id: existing_p000_t060
    checkpoint: ../runs/Shadowhand18Tilted_29-21-15-32_60/nn/Shadowhand18Tilted.pth
    theta_deg: 60
    phi_deg: 0
    base_tilt_axis: [0.0, 1.0, 0.0]
    base_yaw_deg: 0.0
    recorded_reward: 23833.1387
  - id: existing_p000_t090
    checkpoint: ../runs/Shadowhand18Tilted_30-10-12-38_90/nn/Shadowhand18Tilted.pth
    theta_deg: 90
    phi_deg: 0
    base_tilt_axis: [0.0, 1.0, 0.0]
    base_yaw_deg: 0.0
    recorded_reward: 6905.8926
  - id: existing_p000_t115
    checkpoint: ../runs/Shadowhand18Tilted_30-13-27-59_115/nn/Shadowhand18Tilted.pth
    theta_deg: 115
    phi_deg: 0
    base_tilt_axis: [0.0, 1.0, 0.0]
    base_yaw_deg: 0.0
    recorded_reward: 10400.4336
  - id: existing_p000_t130
