# Fixed-base WujiHand curriculum variant. Physics/reset frames change, while
# the zero-degree WujiHand policy interface stays 207 observations / 22 actions.
defaults:
  - WujiHand
  - _self_

name: WujiHandFixedTilt

env:
  # The actual WRJ2/WRJ1 joints connecting forearm to palm are fixed in this
  # asset. Two unloaded invisible joints retain the legacy 22-DOF checkpoint
  # interface without being mechanically connected to the hand.
  assetFileNameWuji: wuji_right_fixed_wrist_compat.urdf
  compatibilityDummyWristDofs: true
  # collapse_fixed_joints merges the rigid forearm/wrist/palm chain under the
  # forearm body name; both frames share the same origin in the Wuji URDF.
  palmBodyName: right_hand_forearm

  # World-frame axis-angle base rotation. Positive angles use the right-hand
  # rule and remain constant throughout an episode.
  baseTiltAngleDeg: 0.0
  baseTiltAxis: [0.0, 1.0, 0.0]
  # A world-Z yaw preserves gravity in the palm and is used by the curriculum
  # to avoid abrupt world-frame observation changes between checkpoints.
  baseYawDeg: 0.0

  # Palm-local object translation copied by the curriculum manifest and
  # manually tuned per gravity-in-palm direction.
  objectPalmOffset: [0.0, 0.0, 0.0]

  # Per-reset gravity grace period for the physical object. Set the hold time
  # to 0 for exact legacy behavior. Standalone non-headless/test runs and the
  # curriculum use this same task implementation.
  objectGravityCompensationSeconds: 0.2
  objectGravityRampSeconds: 0.1

  # Local to WujiHandFixedTilt: distance=1 with +Z normal places the plane at
  # world z=-1, so a dropped object crosses fallDistance before ground contact.
  groundPlaneDistance: 1.0
