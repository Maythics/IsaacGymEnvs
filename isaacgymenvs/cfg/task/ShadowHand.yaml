# used to create the object
name: ShadowHand

physics_engine: ${..physics_engine}

# if given, will override the device setting in gym.
env: 
  numEnvs: ${resolve_default:16384,${...num_envs}}
  envSpacing: 0.75
  episodeLength: 900
  enableDebugVis: False
  aggregateMode: 1

  clipObservations: 5.0
  clipActions: 1.0

  stiffnessScale: 0.4   # multiplies MJCF Kp (1.0 = unchanged); <1 softens contact
  forceLimitScale: 1.0

  useRelativeControl: False
  dofSpeedScale: 20.0
  actionsMovingAverage: 1.0
  actionSpeedScale: 1.0  # multiplier on finger movement speed (1.0 = normal, 0.5 = half speed)
  controlFrequencyInv: 6 # 1 is for 60 Hz

  startPositionNoise: 0.01
  startRotationNoise: 0.0

  resetPositionNoise: 0.01
  resetRotationNoise: 0.0
  resetDofPosRandomInterval: 0.2
  resetDofVelRandomInterval: 0.0

  # Random forces applied to the object
  forceScale: 0
  forceProbRange: [0.05, 0.1]
  forceDecay: 0.99
  forceDecayInterval: 0.08

  # reward -> dictionary
  distRewardScale: -10.0
  rotRewardScale: 2.0
  rotEps: 0.1
  actionPenaltyScale: -0.0002
  reachGoalBonus: 400
  fallDistance: 0.24
  fallPenalty: 0.0

  # Quasi-static manipulation penalties (negative = penalty)
  objLinvelPenaltyScale: 0 #-0.01
  objAngvelPenaltyScale: 0 # -0.05
  dofVelPenaltyScale: -0.001
  palmDistPenaltyScale: -0.5
  # Overspeed thresholds — penalty is zero below limit, grows exp above it
  # formula: -scale * max(0, exp(|speed| - limit) - 1)
  objLinvelLimit: 0.4      # m/s   — scalar speed of object
  objAngvelLimit: 8     #10  # rad/s — scalar angular speed of object
  dofVelLimit: 3         # rad/s — per-joint angular speed threshold

  objectType: "block" # can be block, egg or pen
  objectTypePool: []          # empty = single-type training using objectType above
                              # e.g. ["block","egg","pen","ycb_apple","ycb_banana",
                              #        "ycb_orange","ycb_peach","ycb_pear","ycb_plum",
                              #        "ycb_tomato_soup_can"]
  objectScaleRanges:
    block: [0.9, 1.1]
    egg: [0.8, 1.2]
    pen: [0.6, 1.2]
    default: [0.8, 1.2]      # applied to all ycb_* types
  observationType: "full_state" # can be "openai", "full_no_vel", "full", "full_state"
  asymmetric_observations: False
  # If True, zero-mask obs dims unavailable on a real robot:
  # per-DOF joint torques, per-fingertip linvel+angvel, fingertip 6-axis F/T sensors.
  # Obs dim and sensor creation are unchanged; values are blanked before the policy sees them.
  realWorldObs: False
  successTolerance: 0.4
  printNumSuccesses: False
  maxConsecutiveSuccesses: 0

  # When a goal is reached within an episode, the next goal is the current
  # goal rotated by a random angle (degrees, sampled uniformly in [min, max])
  # around a freshly sampled random unit axis.
  goalRotDeltaDegMin: 20.0
  goalRotDeltaDegMax: 30.0

  # Track goal position in addition to orientation. When True, success requires
  # both rot_dist <= successTolerance AND ||object_pos - goal_pos|| <= posSuccessTolerance.
  # Initial goal position equals the (randomized) object init position offset
  # downward by initGoalDownOffset (the object falls a bit under gravity before
  # settling). Each new subgoal is sampled within [goalPosDeltaMin,
  # goalPosDeltaMax] meters of the previous in a random direction, then clamped
  # to a ball of radius goalPosMaxRadius around object_init_state to prevent
  # unbounded drift.
  trackGoalPos: True
  posSuccessTolerance: 0.04
  goalPosDeltaMin: 0.01
  goalPosDeltaMax: 0.02
  goalPosMaxRadius: 0.044
  # Vertical drift is harder than horizontal — bound world-z offset to ±3 cm.
  goalPosZMaxRadius: 0.04
  initGoalDownOffset: 0.08

  # Wrist-action clip applied every step in BOTH training and test: the first
  # 2 action dims (WRJ1, WRJ0) are clamped to
  # [-wristActionClip, +wristActionClip] before being applied to the env. The
  # policy still emits full-range actions, but the env only ever sees the
  # clipped value, and the next-step observation reflects the clipped action.
  # 1.0 = no clip (action range is already [-1, 1]); smaller values progressively
  # freeze the palm (e.g. 0.05 = near-static wrist for trajectory collection).
  wristActionClip: 0.001

  asset:
    assetFileName: "mjcf/open_ai_assets/hand/shadow_hand.xml"
    assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"
    assetFileNameEgg: "mjcf/open_ai_assets/hand/egg.xml"
    assetFileNamePen: "mjcf/open_ai_assets/hand/pen.xml"

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

task:
  randomize: False
  randomization_params:
    frequency: 720   # Define how many simulation steps between generating new randomizations
    observations:
      range: [0, .002] # range for the white noise
      range_correlated: [0, .001] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      # schedule: "linear"   # "constant" is to turn on noise after `schedule_steps` num steps
      # schedule_steps: 40000
    actions:
      range: [0., .05]
      range_correlated: [0, .015] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      # schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
      # schedule_steps: 40000
    sim_params: 
      gravity:
        range: [0, 0.4]
        operation: "additive"
        distribution: "gaussian"
        # schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
        # schedule_steps: 40000
    actor_params:
      hand:
        color: True
        tendon_properties:
          damping:
            range: [0.3, 3.0]
            operation: "scaling"
            distribution: "loguniform"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
          stiffness:
            range: [0.75, 1.5]
            operation: "scaling"
            distribution: "loguniform"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
        dof_properties:
          damping: 
            range: [0.3, 3.0]
            operation: "scaling"
            distribution: "loguniform"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
          stiffness: 
            range: [0.75, 1.5]
            operation: "scaling"
            distribution: "loguniform"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
          lower:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
          upper:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
        rigid_body_properties:
          mass: 
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
        rigid_shape_properties:
          friction: 
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
      object:
        # scale: disabled — replaced by objectScaleRanges applied in _create_envs
        # scale:
        #   range: [0.95, 1.05]
        #   operation: "scaling"
        #   distribution: "uniform"
        #   setup_only: True
        #   # schedule: "linear"
        #   # schedule_steps: 30000
        rigid_body_properties:
          mass: 
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
            # schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            # schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            # schedule_steps: 30000

sim:
  dt: 0.01667 # 1/60
  substeps: 2
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2 
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 0 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)
