# Goal-conditioned ShadowHand with geometric SE(3) path-reward shaping.
# The observation and action spaces are identical to ShadowHand (211 / 20).
defaults:
  - ShadowHand
  - _self_

name: ShadowHandTrack

env:
  # ShadowHand's default is 60 Hz simulation / 6-step decimation = 10 Hz policy.
  controlFrequencyInv: 6
  observationType: "full_state"
  appendHandBasePose: False

  # Soft reward for the closest point on the static SE(3) segment connecting
  # adjacent goal poses. This does not alter success or termination conditions.
  pathRewardScale: 5.0
  pathPositionSigma: 0.025
  pathRotationSigma: 0.35
  pathSampleCount: 9
